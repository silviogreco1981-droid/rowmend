name: Package RowMend 0.9.0 RC3

on:
  push:
    branches:
      - package/v0.9.0-rc3
      - preview/home-v2-render

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare static deploy directory
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'tests/' \
            --exclude 'test-kit/' \
            --exclude 'distribution/' \
            --exclude 'README.md' \
            --exclude 'ROADMAP.md'

      - name: Verify required release files
        run: |
          test -f _site/index.html
          test -f _site/projects/run/index.html
          test -f _site/projects/run/runner.js
          test -f _site/insights-core.js
          test -f _site/privacy.html

      - name: Upload Netlify deploy package
        uses: actions/upload-artifact@v4
        with:
          name: rowmend-home-v2-preview
          path: _site/
          if-no-files-found: error
          retention-days: 14
